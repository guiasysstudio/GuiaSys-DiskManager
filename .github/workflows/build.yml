name: Windows build
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore src/GuiaSys.DiskManager/GuiaSys.DiskManager.csproj
      - name: Build
        run: dotnet build src/GuiaSys.DiskManager/GuiaSys.DiskManager.csproj --configuration Release --no-restore --warnaserror
